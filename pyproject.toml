[tool.poetry]
name = "sip-demo-backend"
version = "0.1.0"
description = "Backend for AI-powered wine pairing app"
authors = ["aaron.feingold <ajfeingold88@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.8"
uvicorn = "^0.34.0"
asyncpg = "^0.30.0"
sqlalchemy = "^2.0.37"
psycopg2 = "^2.9.10"
pgvector = "^0.3.6"
openai = "^1.61.1"
langchain = "^0.3.17"
tesseract = "^0.1.3"
pdfplumber = "^0.11.5"
pydantic = "^2.10.6"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
black = "^25.1.0"
flake8 = "^7.1.1"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
